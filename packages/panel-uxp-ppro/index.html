<!doctype html>
<html>
  <head>
    <style>
      /* Premiere Pro look: use Adobe's Spectrum UXP widgets (sp-action-button,
         sp-textfield) — they draw with the host's own dark theme, flat and
         square-cornered like Premiere's controls. Plain HTML buttons get UXP's
         default chrome (rounded, light halo) which cannot be styled away. The
         --uxp-host-* variables give the panel Premiere's background/text/border. */
      html, body { margin: 0; padding: 0; }
      body {
        height: 100vh; overflow: hidden; box-sizing: border-box; padding: 10px;
        background-color: var(--uxp-host-background-color, #1e1e1e);
        color: var(--uxp-host-text-color, #d6d6d6);
        font-family: system-ui, sans-serif; font-size: 12px;
      }
      .row { display: flex; flex-direction: row; align-items: center; gap: 6px; margin-bottom: 8px; }
      .title { font-weight: 600; letter-spacing: 0.2px; }
      #logo { height: 19px; width: auto; display: block; margin-right: 4px; }
      /* Bottom-align so the wordmark and the text share a baseline; the badge stays centered. */
      .head { align-items: flex-end; }
      .head .title { line-height: 1; padding-bottom: 0; position: relative; top: 1px; }
      .head .badge { align-self: center; }
      .badge { margin-left: 14px; padding: 1px 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); font-size: 11px; color: var(--uxp-host-text-color, #d6d6d6); }
      .badge.on { background: #2d6a3e; color: #e6f5ea; }
      .badge.off { background: #6b2b2b; color: #f5e6e6; }
      sp-label { width: 40px; color: var(--uxp-host-text-color-secondary, #a0a0a0); }
      sp-textfield { flex: 1; }
      sp-action-button { min-width: 0; }
      /* Height is set by fitLog() in main.js from the real panel height. */
      #log {
        height: 160px; overflow-y: auto; overflow-x: hidden; white-space: pre-wrap; word-break: break-all;
        font-family: Consolas, Menlo, monospace; font-size: 11px;
        background: rgba(0, 0, 0, 0.35); color: var(--uxp-host-text-color, #d6d6d6);
        border: 1px solid var(--uxp-host-border-color, #3a3a3a); padding: 6px; border-radius: 2px; box-sizing: border-box;
      }
      .below { margin-top: 8px; margin-bottom: 4px; }
      #hint { font-size: 10px; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="row head" id="r1"><img id="logo" src="icons/logo.svg" alt="Brainferno" /><span class="title">MCP Bridge</span> <span id="status" class="badge off">disconnected</span></div>
    <div class="row" id="r2">
      <sp-action-button id="connect" size="s" emphasized>Connect</sp-action-button>
      <sp-action-button id="kill" size="s">Kill switch</sp-action-button>
    </div>
    <div class="row" id="r3"><sp-label>Port</sp-label><sp-textfield id="port" size="s" placeholder="7897"></sp-textfield></div>
    <div class="row" id="r4"><sp-label>Token</sp-label><sp-textfield id="token" size="s" placeholder="auto from bridge.json, or paste"></sp-textfield></div>
    <div id="log"></div>
    <div class="row below" id="r5">
      <sp-action-button id="copy" size="s" quiet>Copy log</sp-action-button>
      <sp-action-button id="clear" size="s" quiet>Clear</sp-action-button>
    </div>
    <div id="hint">Log also written to ~/.brainferno-mcp-bridge/panel-premiere.log</div>
  </body>
  <script src="bridge-client.js"></script>
  <script src="commands.js"></script>
  <script src="main.js"></script>
</html>
