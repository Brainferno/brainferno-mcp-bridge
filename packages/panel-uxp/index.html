<!doctype html>
<html>
  <head>
    <style>
      /* Photoshop look: Adobe's own Spectrum UXP widgets (sp-button, sp-textfield)
         follow Photoshop's theme (darkest/dark/light/lightest) automatically, and
         the --uxp-host-* variables give the panel's background/text/border colors. */
      html, body { margin: 0; padding: 0; }
      body { height: 100vh; overflow: hidden; box-sizing: border-box; padding: 10px; background-color: var(--uxp-host-background-color); color: var(--uxp-host-text-color); font-family: system-ui, sans-serif; font-size: 12px; }
      .row { display: flex; flex-direction: row; align-items: center; gap: 8px; margin-bottom: 8px; }
      .title { font-weight: 600; }
      #logo { height: 19px; width: auto; display: block; margin-right: 4px; }
      /* Bottom-align so the wordmark and the text share a baseline; the badge stays centered. */
      .head { align-items: flex-end; }
      .head .title { line-height: 1; padding-bottom: 0; position: relative; top: 1px; }
      .head .badge { margin-left: auto; align-self: flex-end; position: relative; top: 1px; }
      .badge { padding: 2px 9px; border-radius: 9px; background: rgba(128, 128, 128, 0.35); font-size: 11px; }
      .badge.on { background: #2f6f3a; color: #eafbea; }
      .badge.off { background: #6b2b2b; color: #fbeaea; }
      sp-label { width: 42px; }
      sp-textfield { flex: 1; }
      /* Height is set by fitLog() in main.js from the real panel height. */
      #log { height: 160px; overflow-y: auto; overflow-x: hidden; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 11px; background: rgba(0, 0, 0, 0.28); color: var(--uxp-host-text-color); border: 1px solid var(--uxp-host-border-color); padding: 6px; border-radius: 4px; box-sizing: border-box; }
      .below { margin-top: 8px; margin-bottom: 4px; }
      #hint { font-size: 10px; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div class="row head" id="r1"><img id="logo" src="icons/logo.svg" alt="Brainferno" /><span class="title">MCP Bridge</span> <span id="status" class="badge off">disconnected</span></div>
    <div class="row" id="r2"><sp-button id="connect" size="s" variant="cta">Connect</sp-button><sp-button id="kill" size="s" variant="secondary">Kill switch</sp-button></div>
    <div class="row" id="r3"><sp-label>Port</sp-label><sp-textfield id="port" placeholder="7897"></sp-textfield></div>
    <div class="row" id="r4"><sp-label>Token</sp-label><sp-textfield id="token" placeholder="auto from bridge.json, or paste"></sp-textfield></div>
    <div id="log"></div>
    <div class="row below" id="r5"><sp-button id="copy" size="s" variant="secondary">Copy log</sp-button><sp-button id="clear" size="s" variant="secondary" quiet>Clear</sp-button></div>
    <div id="hint">Log also written to ~/.brainferno-mcp-bridge/panel-photoshop.log</div>
  </body>
  <script src="bridge-client.js"></script>
  <script src="commands.js"></script>
  <script src="main.js"></script>
</html>
