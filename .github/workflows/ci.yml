name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The audio lane test runs a real ffmpeg when one is on PATH (and skips otherwise).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Check the panels are in sync with the shared bridge client
        if: runner.os == 'Linux'
        run: |
          npm run panels:sync
          git diff --exit-code -- packages/panel-uxp/bridge-client.js packages/panel-uxp-ppro/bridge-client.js packages/panel-cep/bridge-client.js
