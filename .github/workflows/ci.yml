name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS are the platforms this software supports — the Adobe applications
        # it drives run nowhere else. Ubuntu is here as a fast build/test machine for the
        # platform-independent logic (no Adobe app is involved in any test), not as a target.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The audio lane test runs a real ffmpeg when one is on PATH (and skips otherwise).
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Check the panels are in sync with the shared bridge client
        if: runner.os == 'Linux'
        run: |
          npm run panels:sync
          git diff --exit-code -- packages/panel-uxp/bridge-client.js packages/panel-uxp-ppro/bridge-client.js packages/panel-cep/bridge-client.js

      - name: Check the panel versions are stamped, and that they package
        if: runner.os == 'Linux'
        run: |
          npm run panels:stamp
          git diff --exit-code -- packages/panel-uxp packages/panel-uxp-ppro packages/panel-cep
          # Packaging smoke test on every push; cep.zxp is skipped without ZXPSignCmd.
          node scripts/package-panels.mjs
