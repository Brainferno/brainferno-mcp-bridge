name: Publish to npm

# Publishes both packages when a version tag (v1.2.3) is pushed, after the same
# checks CI runs. Authentication is npm "trusted publishing" (OpenID Connect):
# npmjs.com → each package → Settings → Trusted Publisher → GitHub Actions,
# repository Brainferno/brainferno-mcp-bridge, workflow publish.yml. No token
# is stored anywhere; GitHub proves to npm that this workflow is running.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the tag matches the package versions
        run: |
          s=$(node -p "require('./packages/server/package.json').version")
          p=$(node -p "require('./packages/protocol/package.json').version")
          [ "v$s" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != server version v$s"; exit 1; }
          [ "$p" = "$s" ] || { echo "protocol version $p != server version $s"; exit 1; }
      - name: Publish @brainferno/mcp-bridge-protocol
        run: npm publish -w packages/protocol --access public --provenance
      - name: Publish brainferno-mcp-bridge
        run: npm publish -w packages/server --access public --provenance
