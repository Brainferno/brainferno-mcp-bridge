name: Publish to npm

# Publishes both packages when a version tag (v1.2.3) is pushed, once CI is green for that
# commit on every platform, then creates the GitHub release for that tag. Authentication
# to npm is "trusted publishing" (OpenID Connect): npmjs.com → each package →
# Settings → Trusted Publisher → GitHub Actions, repository
# Brainferno/brainferno-mcp-bridge, workflow publish.yml. No token is stored
# anywhere; GitHub proves to npm that this workflow is running.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # trusted publishing + provenance
  actions: read # read ci.yml's result for this commit

jobs:
  # This job's own tests run on Ubuntu only, so a Windows- or macOS-specific failure could
  # not block a release on its own — v0.2.2 published while CI was red on both Windows legs.
  # ci.yml runs on tag pushes too, so there is always a run for this exact commit to wait on.
  ci-green:
    name: CI green for this commit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ci.yml to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          query='[.workflow_runs[]] | sort_by(.run_started_at) | last | if . == null then "none none -" else "\(.status) \(.conclusion // "pending") \(.html_url)" end'
          deadline=$(( $(date +%s) + 1800 ))   # 30 minutes
          while true; do
            result=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" --jq "$query")
            status=$(echo "$result" | cut -d" " -f1)
            conclusion=$(echo "$result" | cut -d" " -f2)
            url=$(echo "$result" | cut -d" " -f3)
            if [ "$status" = "completed" ]; then
              echo "CI concluded $conclusion — $url"
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "::error::CI is $conclusion for $SHA. Nothing was published. Fix it and re-run this workflow."
              exit 1
            fi
            if [ "$status" = "none" ]; then
              echo "No ci.yml run for $SHA yet; waiting."
            else
              echo "CI is $status; waiting."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci.yml did not finish within 30 minutes for $SHA. Nothing was published."
              exit 1
            fi
            sleep 20
          done

  # The installable panels: .ccx zips plus cep.zxp signed by ZXPSignCmd. Adobe
  # ships ZXPSignCmd for Windows and macOS only, so this runs on macOS. cep.zxp
  # is signed with the release certificate when the two secrets exist
  # (ZXP_CERT_P12_BASE64, ZXP_CERT_PASSWORD — generate the .p12 once with
  # `ZXPSignCmd -selfSignedCert` and base64 it in); without them the .ccx files
  # still build and the zxp is skipped, so releases work before the secrets are
  # set up.
  panels:
    name: Build panel installables
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package the panels (.ccx, signed .zxp)
        env:
          ZXP_CERT_P12_BASE64: ${{ secrets.ZXP_CERT_P12_BASE64 }}
          ZXP_CERT_PASSWORD: ${{ secrets.ZXP_CERT_PASSWORD }}
        run: |
          if [ -n "$ZXP_CERT_P12_BASE64" ] && [ -n "$ZXP_CERT_PASSWORD" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ZXPSignCmd" "https://github.com/Adobe-CEP/CEP-Resources/raw/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd"
            chmod +x "$RUNNER_TEMP/ZXPSignCmd"
            echo "$ZXP_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/zxp.p12"
            export ZXPSIGNCMD="$RUNNER_TEMP/ZXPSignCmd"
            export BRAINFERNO_ZXP_P12="$RUNNER_TEMP/zxp.p12"
            export BRAINFERNO_ZXP_PASSWORD="$ZXP_CERT_PASSWORD"
            node scripts/package-panels.mjs --require-zxp
          else
            echo "::warning::ZXP cert secrets not set: cep.zxp will be missing from this release (the dev junction fallback still works)."
            node scripts/package-panels.mjs
          fi
          ls -la dist-panels
      - uses: actions/upload-artifact@v7
        with:
          name: panel-installables
          path: dist-panels/
          if-no-files-found: error

  publish:
    needs: [ci-green, panels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: Check the tag matches the package versions
        run: |
          s=$(node -p "require('./packages/server/package.json').version")
          p=$(node -p "require('./packages/protocol/package.json').version")
          [ "v$s" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != server version v$s"; exit 1; }
          [ "$p" = "$s" ] || { echo "protocol version $p != server version $s"; exit 1; }

      # Built by the `panels` job (macOS: no Linux ZXPSignCmd exists). Landing
      # in dist-panels/ means prepack ships them inside the npm package too.
      - name: Fetch the panel installables
        uses: actions/download-artifact@v8
        with:
          name: panel-installables
          path: dist-panels

      - name: Publish @brainferno/mcp-bridge-protocol
        run: npm publish -w packages/protocol --access public --provenance
      - name: Publish brainferno-mcp-bridge
        run: npm publish -w packages/server --access public --provenance

      - name: Pack the tarballs for the release page
        run: |
          mkdir -p release
          npm pack -w packages/protocol --pack-destination release >/dev/null
          npm pack -w packages/server --pack-destination release >/dev/null
          v="${GITHUB_REF_NAME#v}"
          cp dist-panels/photoshop.ccx "release/brainferno-mcp-bridge-photoshop-$v.ccx"
          cp dist-panels/premiere.ccx "release/brainferno-mcp-bridge-premiere-$v.ccx"
          if [ -f dist-panels/cep.zxp ]; then cp dist-panels/cep.zxp "release/brainferno-mcp-bridge-cep-$v.zxp"; fi
          ls -la release

      - name: Release notes from CHANGELOG.md
        run: |
          # The section for this version: from "## v1.2.3" up to the next "## ".
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag "([ —-]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release/notes.md
          if [ ! -s release/notes.md ]; then
            echo "No CHANGELOG.md section for ${GITHUB_REF_NAME}; see the commit list below." > release/notes.md
          fi
          {
            echo
            echo "Install: \`npm install -g brainferno-mcp-bridge@${GITHUB_REF_NAME#v}\` then \`brainferno-mcp-bridge-install\`."
            echo
            echo "npm: https://www.npmjs.com/package/brainferno-mcp-bridge/v/${GITHUB_REF_NAME#v}"
          } >> release/notes.md
          cat release/notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release/*.tgz release/*.ccx)
          if compgen -G "release/*.zxp" > /dev/null; then assets+=(release/*.zxp); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release/notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "${GITHUB_REF_NAME}" --notes-file release/notes.md --verify-tag --latest
          fi
