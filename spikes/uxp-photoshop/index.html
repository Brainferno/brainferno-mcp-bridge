<!doctype html>
<html>
  <head>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; box-sizing: border-box; padding: 8px 8px 16px 8px; font-family: system-ui, sans-serif; font-size: 12px; color: #ddd; }
      .row { display: flex; flex-direction: row; align-items: center; gap: 6px; margin-bottom: 6px; flex-shrink: 0; }
      .badge { padding: 2px 8px; border-radius: 10px; background: #555; }
      .badge.on { background: #2e7d32; }
      .badge.off { background: #7a2a2a; }
      input { flex: 1; min-width: 60px; }
      label { width: 40px; flex-shrink: 0; }
      button { cursor: pointer; }
      #log { flex: 1; min-height: 80px; overflow: auto; white-space: pre-wrap; word-break: break-all; font-family: monospace; font-size: 11px; background: #1e1e1e; padding: 6px; border-radius: 4px; }
      .below { margin-top: 8px; margin-bottom: 12px; }
      #hint { flex-shrink: 0; font-size: 10px; color: #999; }
    </style>
  </head>
  <body>
    <div class="row"><strong>adobe-cc-mcp bridge</strong> <span id="status" class="badge off">disconnected</span></div>
    <div class="row"><button id="connect">Connect</button><button id="kill">Kill switch</button></div>
    <div class="row"><label>Port</label><input id="port" placeholder="7897" /></div>
    <div class="row"><label>Token</label><input id="token" placeholder="auto from bridge.json, or paste" /></div>
    <div id="log"></div>
    <div class="row below"><button id="copy">Copy log</button><button id="clear">Clear</button></div>
    <div id="hint">Log also written to ~/.adobe-cc-mcp/panel-photoshop.log</div>
  </body>
  <script src="main.js"></script>
</html>
